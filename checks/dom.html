<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>chat-screenshot fixture</title>
    <style>
      body { margin: 0; font: 14px/1.6 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
      #root { width: 720px; padding: 0 24px; }
      [data-conversation-scroll] { height: 600px; overflow: auto; }
      .turn { padding: 12px 0; }
      .clock { font-size: 12px; color: #888; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div data-conversation-scroll="true">
        <div data-chat-history="idle">
          <button type="button">
            <span class="hidden" aria-hidden="true">加载更早</span>
            <span aria-hidden="false">正在加载</span>
            <span class="hidden" aria-hidden="true">正在处理</span>
            <span class="hidden" aria-hidden="true">重新加载</span>
            <span class="hidden" aria-hidden="true">已到会话开头</span>
          </button>
        </div>
        <div data-chat-turn="1" class="turn"><div>第一轮问题</div><div class="clock" data-clock="start">12:00</div></div>
        <div data-chat-turn="2" class="turn">
          <div data-step-process="true">思考中…</div>
          <div>第一轮回答</div>
          <div data-message-attachments="true">a.png</div>
          <div class="clock" data-clock="end">12:01</div>
        </div>
        <nav>导航</nav>
        <div data-width-handle="true">handle</div>
        <div class="toBottomSlot">回到底部</div>
        <div data-composer-seat="true">输入区</div>
        <div class="flow">
          <div data-chat-flow-kind="user">第一轮 用户消息</div>
          <div data-chat-turn="1"><div>第一轮回答</div><div data-turn-tail="true"><button type="button">操作</button></div></div>
          <div data-chat-flow-kind="user">第二轮 用户消息</div>
          <div data-chat-turn="2"><div>第二轮回答</div><div data-turn-tail="true"><button type="button">操作</button></div></div>
          <div data-chat-flow-kind="user">第三轮 用户消息</div>
          <div data-chat-turn="3"><div>第三轮回答（还在生成）</div></div>
        </div>
      </div>
    </div>
    <script type="module">

      import { readPaging, classifyPaging, hasOlderPages, findLoadOlder } from '../src/client/dom/paging.js'
      import { applyRules, autoName, elementKey } from '../src/client/dom/rules.js'
      import { buildStage } from '../src/client/dom/stage.js'
      import { insertBlocks } from '../src/client/dom/inserts.js'
      import { renderTemplate, tokenValues } from '../src/client/dom/tokens.js'
      import { planCrop } from '../src/client/dom/band.js'
      import { normalizeOptions } from '../src/client/shell/options.js'
      import { turnList, pruneTurns } from '../src/client/dom/turn.js'
      window.addEventListener('error', (event) => { window.__fatal = String(event.message) + ' @' + event.lineno })

      const results = []
      const check = (name, ok, detail) => results.push({ name, ok: ok === true, detail: String(detail) })
      const scroller = document.querySelector('[data-conversation-scroll]')

      // --- the paging control, as the host mounts it: one button carrying all five labels ----------
      const paging = readPaging(scroller)
      check('paging is found', paging !== null, paging === null ? 'null' : 'ok')
      check('the visible label decides the state', paging?.state === 'busy', paging?.state)
      check('a busy control is not a click target', findLoadOlder(scroller) === null, findLoadOlder(scroller)?.tagName ?? 'null')
      check('a busy control still means older pages exist', hasOlderPages(scroller) === true, hasOlderPages(scroller))
      check('all five labels at once classify to nothing', classifyPaging('加载更早正在加载正在处理重新加载已到会话开头') === null, classifyPaging('加载更早正在加载正在处理重新加载已到会话开头'))

      const button = scroller.querySelector('[data-chat-history] button')
      const show = (index) => {
        button.querySelectorAll('span').forEach((span, at) => {
          span.classList.toggle('hidden', at !== index)
          span.setAttribute('aria-hidden', at === index ? 'false' : 'true')
        })
      }

      // --- the actionable state ------------------------------------------------------------------
      show(0)
      const more = readPaging(scroller)
      check('the "more" label is the actionable one', more?.state === 'more' && findLoadOlder(scroller) === button, more?.state)
      check('"more" offers pages', hasOlderPages(scroller) === true, hasOlderPages(scroller))

      show(3)
      check('the retry label is clickable too', findLoadOlder(scroller) === button, findLoadOlder(scroller)?.tagName ?? 'null')

      // --- the end of the history: mounted, disabled, labelled "start" ----------------------------
      button.disabled = true
      show(4)
      const start = readPaging(scroller)
      check('a disabled control reports its label', start?.state === 'start' && start.disabled === true, `${start?.state}/${start?.disabled}`)
      check('a disabled control is not a click target', findLoadOlder(scroller) === null, 'clickable')
      check('the end of the history offers no pages', hasOlderPages(scroller) === false, 'claims pages')
      check('the control is still in the layout', scroller.querySelector('[data-chat-history]') !== null, 'unmounted')

      // --- chrome follows the switches, by hiding what they name ----------------------------------
      const cloneAll = scroller.cloneNode(true)
      applyRules(cloneAll, normalizeOptions({}))
      const shown = (root, selector) =>
        Array.from(root.querySelectorAll(selector)).filter((el) => el.style.display !== 'none').length
      const all = {
        clock: shown(cloneAll, '[data-clock]'),
        step: shown(cloneAll, '[data-step-process]'),
        files: shown(cloneAll, '[data-message-attachments]'),
        nav: shown(cloneAll, 'nav'),
        handle: shown(cloneAll, '[data-width-handle]'),
        bottom: shown(cloneAll, '.toBottomSlot'),
      }
      check('defaults hide the clock, nav, handles and the bottom button', all.clock === 0 && all.nav === 0 && all.handle === 0 && all.bottom === 0, JSON.stringify(all))
      check('defaults keep the thinking row and the attachments', all.step === 1 && all.files === 1, JSON.stringify(all))
      check(
        'a hidden part stays in the copy',
        cloneAll.querySelectorAll('[data-clock]').length === 2,
        String(cloneAll.querySelectorAll('[data-clock]').length),
      )

      const cloneKept = scroller.cloneNode(true)
      applyRules(cloneKept, normalizeOptions({ hideClock: false, hideProcess: false, hideAttachments: false }))
      const kept = {
        clock: shown(cloneKept, '[data-clock]'),
        step: shown(cloneKept, '[data-step-process]'),
        files: shown(cloneKept, '[data-message-attachments]'),
      }
      check('the switches keep what they name', kept.clock === 2 && kept.step === 1 && kept.files === 1, JSON.stringify(kept))

      // --- the same call describes what it did, for the inspector --------------------------------
      const described = scroller.cloneNode(true)
      const applied = applyRules(described, normalizeOptions({}))
      const byId = {}
      for (const entry of applied.entries) byId[entry.id] = entry
      check(
        'the built-in names are reported as entries',
        byId.clock !== undefined && byId.clock.elements.length === 2 && byId.paging !== undefined && byId.composer !== undefined,
        Object.keys(byId).join(','),
      )
      check(
        'an entry knows whether it is hidden',
        byId.clock.hide === true && byId.process.hide === false,
        `${byId.clock.hide}/${byId.process.hide}`,
      )
      check(
        'the copy says which part each element is',
        described.querySelector('[data-clock]')?.getAttribute('data-dsh-screenshot-piece') === 'clock',
        described.querySelector('[data-clock]')?.getAttribute('data-dsh-screenshot-piece') ?? 'null',
      )

      // --- a rule names any element at all ------------------------------------------------------
      const ruleTarget = scroller.querySelector('[data-chat-turn]')
      const ruleKey = elementKey(ruleTarget, scroller)
      check('any element gets a stable key', typeof ruleKey === 'string' && ruleKey.length > 0, String(ruleKey))
      check(
        'the key resolves back to the same element',
        (() => {
          try {
            return scroller.querySelector(ruleKey) === ruleTarget
          } catch {
            return false
          }
        })(),
        ruleKey,
      )
      const ruled = scroller.cloneNode(true)
      applyRules(
        ruled,
        normalizeOptions({
          rules: [
            { selector: ruleKey, name: '首轮', hide: true, style: { opacity: '0.5' }, attrs: { 'data-mark': 'yes' } },
            { selector: '.nothing-here', hide: true },
            { selector: '  ', hide: true },
          ],
        }),
      )
      const ruledTarget = ruled.querySelector(ruleKey)
      check('a rule hides the element it names', ruledTarget?.style.display === 'none', ruledTarget?.style.display ?? 'null')
      check('a rule also carries style', ruledTarget?.style.opacity === '0.5', ruledTarget?.style.opacity ?? 'null')
      check('a rule also carries attributes', ruledTarget?.getAttribute('data-mark') === 'yes', ruledTarget?.getAttribute('data-mark') ?? 'null')
      check(
        'the rule names only what it found',
        applied.entries.filter((entry) => entry.kind === 'rule').length === 0,
        'a rule leaked into another run',
      )

      // --- the automatic name falls back in a predictable order ----------------------------------
      const named = scroller.querySelector('[data-clock]')
      check('an automatic name prefers readable text', autoName(named).length > 0 && !autoName(named).startsWith('['), autoName(named))
      const silent = document.createElement('div')
      silent.setAttribute('data-some-marker', '')
      scroller.appendChild(silent)
      check('a silent element falls back to its marker', autoName(silent) === 'some marker', autoName(silent))
      silent.setAttribute('aria-label', '有名字')
      check('an explicit label wins', autoName(silent) === '有名字', autoName(silent))
      silent.remove()

      // --- the edit surface, built in the conversation's place --------------------------------------
      const stageOptions = normalizeOptions({
        blocks: [
          { kind: 'text', zone: 'top', text: '' },
          { kind: 'text', zone: 'top', text: '副标题', size: 'subtitle' },
          { kind: 'text', zone: 'bottom', text: '页脚' },
        ],
      })
      const stage = buildStage(scroller.querySelector('[data-chat-turn]'), stageOptions, {
        text: '在这里输入',
        image: '添加图片',
        zone: '放在这里',
      })
      document.body.appendChild(stage.element)
      const fields = stage.head === null ? [] : Array.from(stage.head.querySelectorAll('[data-dsh-screenshot-field]'))
      check('the surface is the editor', stage.element.hasAttribute('data-dsh-screenshot-editor') === true, 'not tagged')
      check('the header is there to write in before it has text', fields.length === 2, String(fields.length))
      check(
        'the fields are editable in place',
        fields[0]?.getAttribute('contenteditable') === 'plaintext-only',
        fields[0]?.getAttribute('contenteditable') ?? 'null',
      )
      check(
        'an empty field keeps its hint out of the text',
        fields[0]?.textContent === '' && fields[0]?.getAttribute('data-empty') === 'true',
        JSON.stringify({ text: fields[0]?.textContent, empty: fields[0]?.getAttribute('data-empty') }),
      )
      const copyIds = Array.from(
        new Set(Array.from(stage.clone.querySelectorAll('[data-dsh-screenshot-piece]')).map((el) => el.getAttribute('data-dsh-screenshot-piece'))),
      ).sort()
      check('the edit copy still holds every part', copyIds.length === 8, copyIds.join(','))
      check(
        'the footer offers its own field',
        stage.foot?.querySelectorAll('[data-dsh-screenshot-field]').length === 1,
        String(stage.foot?.querySelectorAll('[data-dsh-screenshot-field]').length),
      )
      stage.destroy()
      check(
        'closing takes the surface away',
        document.querySelector('[data-dsh-screenshot-editor]') === null,
        'left behind',
      )

      // --- the inserted blocks, in the order a capture builds them -------------------------------
      // The clone is measured while attached, exactly as the capture does it: a detached subtree has no
      // layout, so every rect reads zero and the crop would look correct by accident.
      const holder = document.createElement('div')
      holder.style.cssText = 'position:fixed;top:0;left:0;width:720px;opacity:0;pointer-events:none;'
      document.body.appendChild(holder)

      const clone = scroller.cloneNode(true)
      const options = normalizeOptions({
        blocks: [
          { kind: 'text', zone: 'top', text: '标题 {turns}' },
          { kind: 'divider', zone: 'top' },
          { kind: 'meta', zone: 'bottom' },
        ],
        align: 'center',
      })
      applyRules(clone, options)
      clone.style.height = 'auto'
      clone.style.overflow = 'visible'
      holder.appendChild(clone)
      const values = { ...tokenValues(document), turns: '2', date: '2026-11-25', time: '09:05' }
      const blocks = insertBlocks(clone, options, values)
      const names = Array.from(clone.children).map((el) => el.tagName + (el.getAttribute('data-dsh-screenshot-head') ? ':head' : el.getAttribute('data-dsh-screenshot-foot') ? ':foot' : ''))
      check('the header is the first block', clone.firstElementChild === blocks.head, names.join(' '))
      check('the footer is the last block', clone.lastElementChild === blocks.foot, names.join(' '))
      check('the header fills the reader\'s placeholders', blocks.head?.textContent.includes('标题 2') === true, blocks.head?.textContent ?? 'null')
      check('the meta line follows the text', blocks.foot?.textContent.includes('2 轮对话') === true, blocks.foot?.textContent ?? 'null')
      check('an unknown token survives', renderTemplate('{nope}', values) === '{nope}', 'eaten')
      const drawn = Array.from(clone.querySelectorAll('[data-dsh-screenshot-block]')).map((el) => el.className)
      check(
        'every block is tagged with the id it came from',
        drawn.length === 3 && options.blocks.every((block) => clone.querySelector(`[data-dsh-screenshot-block="${block.id}"]`) !== null),
        drawn.join(' '),
      )

      // The crop has to start above the first turn when a header was added, and reach past the footer.
      const box = clone.getBoundingClientRect()
      const headTop = blocks.head.getBoundingClientRect().top - box.top
      const footBottom = blocks.foot.getBoundingClientRect().bottom - box.top
      const firstTurnTop = clone.querySelector('[data-chat-turn]').getBoundingClientRect().top - box.top
      check('the header sits above the first turn', headTop < firstTurnTop, `head ${Math.round(headTop)} turn ${Math.round(firstTurnTop)}`)
      check('the footer sits below the last turn', footBottom > firstTurnTop, `foot ${Math.round(footBottom)}`)

      const crop = planCrop({
        measured: clone.scrollHeight,
        scrollerTop: 0,
        firstTurnTop: Math.min(firstTurnTop, headTop),
        lastTurnBottom: 0,
        contentBottom: footBottom,
      })
      check('the crop starts at the header, not at the first turn', crop.top === 0, `top ${crop.top} head ${Math.round(headTop)} turn ${Math.round(firstTurnTop)}`)
      check('the crop reaches the footer', Math.round(crop.bottom) >= Math.round(footBottom), `bottom ${Math.round(crop.bottom)} foot ${Math.round(footBottom)}`)

      holder.remove()

      // --- turns, as the right-click menu reads them ---------------------------------------------
      const turns = turnList(scroller)
      check('three turns are listed', turns.length === 3, String(turns.length))
      check('a turn is keyed by its opening message', turns[0].label === '第一轮 用户消息', turns[0].label)
      check('a finished turn finds its tail', turns[0].tail !== null && turns[1].tail !== null, `${turns[0].tail !== null}/${turns[1].tail !== null}`)
      check('a reply still streaming has no tail', turns[2].tail === null, turns[2].tail === null ? 'null' : 'found')

      const single = scroller.cloneNode(true)
      const prunedSingle = pruneTurns(single, [1])
      const singleUnits = Array.from(single.querySelector('.flow').children).map((el) => el.textContent.trim().slice(0, 4))
      check('one turn keeps its own units', prunedSingle === true && singleUnits.length === 2, singleUnits.join('|'))
      check('the other turns are dropped', !singleUnits.join('').includes('第一轮') && !singleUnits.join('').includes('第三轮'), singleUnits.join('|'))

      const multi = scroller.cloneNode(true)
      pruneTurns(multi, [0, 2])
      const multiUnits = Array.from(multi.querySelector('.flow').children).map((el) => el.textContent.trim().slice(0, 3))
      check('two turns keep four units', multiUnits.length === 4, multiUnits.join('|'))
      check('the unselected middle turn is gone', !multiUnits.join('').includes('第二轮'), multiUnits.join('|'))
      check('the streaming turn is capturable', multiUnits.join('').includes('第三'), multiUnits.join('|'))
      check('an out-of-range index keeps nothing', pruneTurns(scroller.cloneNode(true), [9]) === false, 'pruned')

      window.__verify = results
      const report = document.createElement('pre')
      report.id = 'report'
      report.textContent = results.map((entry) => `${entry.ok ? 'ok  ' : 'FAIL'} ${entry.name} — ${entry.detail}`).join('\n')
      document.body.appendChild(report)
      document.title = results.every((entry) => entry.ok) ? 'PASS' : 'FAIL'
    </script>
  </body>
</html>
